services:
  postgres:
    image: postgres:16-alpine
    container_name: buchifin-postgres
    environment:
      POSTGRES_USER: buchifin
      POSTGRES_PASSWORD: buchifin123
      POSTGRES_DB: buchifin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buchifin -d buchifin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
